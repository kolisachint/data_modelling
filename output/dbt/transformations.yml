# transformations.yml
# Universal transformation registry — single source of truth for all
# source-to-target transformation logic.
#
# Fields:
#   target_entity    : BigQuery table name (snake_case)
#   target_column    : BigQuery column name
#   source_system    : Source system name (e.g. CRM, OMS, PIM)
#   source_table     : Source table / object name
#   source_column    : Source column / field name
#   logic            : SQL expression or 'Direct' for pass-through
#   notes            : Free-form notes for reviewers
#   dbt_macro        : Optional dbt_utils macro name if applicable
#   tested           : true/false — whether dbt tests cover this column
#
version: 2
transformations:
  - target_entity: Customer
    target_column: customer_code
    source_system: CRM
    source_table:  crm_accounts
    source_column: account_id
    logic:         CAST(account_id AS STRING)
    notes:         Natural key from CRM
    dbt_macro:     null
    tested:        false

  - target_entity: Customer
    target_column: full_name
    source_system: CRM
    source_table:  crm_accounts
    source_column: name
    logic:         TRIM(name)
    dbt_macro:     null
    tested:        false

  - target_entity: Customer
    target_column: email
    source_system: CRM
    source_table:  crm_accounts
    source_column: email_address
    logic:         LOWER(email_address)
    notes:         Normalise to lowercase
    dbt_macro:     null
    tested:        false

  - target_entity: Customer
    target_column: phone
    source_system: CRM
    source_table:  crm_accounts
    source_column: phone_number
    logic:         "REGEXP_REPLACE(phone_number, '[^0-9+]', '')"
    notes:         Strip non-numeric
    dbt_macro:     null
    tested:        false

  - target_entity: Customer
    target_column: country_code
    source_system: CRM
    source_table:  crm_accounts
    source_column: country
    logic:         "UPPER(LEFT(country, 2))"
    notes:         ISO-2 from full name — verify mapping
    dbt_macro:     null
    tested:        false

  - target_entity: Order
    target_column: order_ref
    source_system: OMS
    source_table:  orders
    source_column: id
    logic:         "CONCAT('ORD-', LPAD(CAST(id AS STRING), 10, '0'))"
    notes:         Pad to 10 digits
    dbt_macro:     null
    tested:        false

  - target_entity: Order
    target_column: customer_id
    source_system: OMS
    source_table:  orders
    source_column: cust_id
    logic:         Lookup via customer_code
    notes:         Join to Customer on code
    dbt_macro:     null
    tested:        false

  - target_entity: Order
    target_column: status_code
    source_system: OMS
    source_table:  orders
    source_column: status
    logic:         UPPER(status)
    dbt_macro:     null
    tested:        false

  - target_entity: Order
    target_column: order_date
    source_system: OMS
    source_table:  orders
    source_column: placed_date
    logic:         DATE(placed_date)
    dbt_macro:     null
    tested:        false

  - target_entity: OrderItem
    target_column: order_id
    source_system: OMS
    source_table:  order_lines
    source_column: order_id
    logic:         Direct
    dbt_macro:     null
    tested:        false

  - target_entity: OrderItem
    target_column: product_id
    source_system: OMS
    source_table:  order_lines
    source_column: prod_sku
    logic:         Lookup via Product.sku
    notes:         Join to Product on sku
    dbt_macro:     null
    tested:        false

  - target_entity: OrderItem
    target_column: quantity
    source_system: OMS
    source_table:  order_lines
    source_column: qty
    logic:         CAST(qty AS INT64)
    dbt_macro:     null
    tested:        false

  - target_entity: OrderItem
    target_column: unit_price
    source_system: OMS
    source_table:  order_lines
    source_column: price
    logic:         "ROUND(price, 2)"
    notes:         2 decimal places
    dbt_macro:     null
    tested:        false

  - target_entity: Product
    target_column: sku
    source_system: PIM
    source_table:  products
    source_column: sku
    logic:         UPPER(TRIM(sku))
    dbt_macro:     null
    tested:        false

  - target_entity: Product
    target_column: product_name
    source_system: PIM
    source_table:  products
    source_column: title
    logic:         TRIM(title)
    dbt_macro:     null
    tested:        false

  - target_entity: Product
    target_column: category
    source_system: PIM
    source_table:  products
    source_column: category_name
    logic:         Direct
    dbt_macro:     null
    tested:        false

  - target_entity: Product
    target_column: unit_cost
    source_system: PIM
    source_table:  products
    source_column: cost_price
    logic:         CAST(cost_price AS NUMERIC)
    dbt_macro:     null
    tested:        false

  - target_entity: Product
    target_column: is_active
    source_system: PIM
    source_table:  products
    source_column: active_flag
    logic:         CAST(active_flag AS BOOL)
    notes:         0/1 → FALSE/TRUE
    dbt_macro:     null
    tested:        false

