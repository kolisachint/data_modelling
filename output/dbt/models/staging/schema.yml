version: 2

sources:
  - name: crm
    description: Source system — CRM
    tables:
      - name: crm_accounts

  - name: oms
    description: Source system — OMS
    tables:
      - name: order_lines
      - name: orders

  - name: pim
    description: Source system — PIM
    tables:
      - name: products

models:

  - name: stg_crm_customer
    description: >
      Staging model for Customer. A person or organisation that places orders.
    columns:
      - name: customer_id
        description: Surrogate key
        tests:
          - unique
          - not_null
      - name: customer_code
        description: Business key from source CRM
      - name: full_name
        description: Full name
      - name: email
        description: Primary email address
      - name: phone
        description: Contact phone number
      - name: country_code
        description: ISO 3166-1 alpha-2
      - name: created_at
        description: Record creation timestamp
      - name: updated_at
        description: Last update timestamp

  - name: stg_oms_order
    description: >
      Staging model for Order. A transaction placed by a customer.
    columns:
      - name: order_id
        description: Surrogate key
        tests:
          - unique
          - not_null
      - name: order_ref
        description: Business order reference
      - name: customer_id
        description: FK to Customer
      - name: status_code
        description: FK to OrderStatus lookup
      - name: order_date
        description: Date order was placed
      - name: total_amount
        description: Total order value (excl tax)
      - name: currency_code
        description: ISO 4217 currency code
      - name: created_at
        description: Record creation timestamp

  - name: stg_oms_orderitem
    description: >
      Staging model for OrderItem. A single line in an order referencing a product.
    columns:
      - name: order_item_id
        description: Surrogate key
        tests:
          - unique
          - not_null
      - name: order_id
        description: FK to Order
      - name: product_id
        description: FK to Product
      - name: quantity
        description: Number of units ordered
      - name: unit_price
        description: Price per unit at time of order
      - name: line_total
        description: "quantity * unit_price"

  - name: stg_pim_product
    description: >
      Staging model for Product. A product available for sale.
    columns:
      - name: product_id
        description: Surrogate key
        tests:
          - unique
          - not_null
      - name: sku
        description: Stock keeping unit
      - name: product_name
        description: Display name
      - name: category
        description: Product category
      - name: unit_cost
        description: Cost price
      - name: is_active
        description: Whether product is on sale
      - name: created_at
        description: Record creation timestamp

